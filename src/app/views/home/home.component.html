<section

>

    <span class="absolute left-[81px] top-9 size-[50px] rounded-full bg-[#3d6af0]/45"></span>
    <span class="absolute left-[226px] top-14 size-[30px] rounded-full bg-[#5b8bff]/40"></span>
    <span class="absolute -right-5 top-[70px] size-20 rounded-full bg-[#2f63f0]/50"></span>
    <span class="absolute right-2 -top-3.5 size-12 rounded-full bg-[#6ea0ff]/35"></span>

    <span class="absolute right-[57px] top-40 size-[30px] rounded-full bg-white/20"></span>

  <header class="relative z-10 flex items-start justify-between px-6 pt-8">
    <span class="mt-5 flex w-9 flex-col items-start gap-1.5" aria-hidden="true">
      <span class="h-1 w-5 rounded-full bg-white"></span>
      <span class="h-1 w-9 rounded-full bg-white"></span>
      <span class="h-1 w-5 rounded-full bg-white"></span>
    </span>

    <img
      src="/assets/home/logo-q.svg"
      alt="Quizy"
      width="107"
      height="116"

    <img

      alt=""
      width="50"
      height="50"
      class="mt-3 size-[50px] rounded-full object-cover"
    />

    <div class="pointer-events-none absolute -right-10 top-28" aria-hidden="true">
      <span

        <img
          src="/assets/home/easy-quiz.png"
          alt=""
          width="80"
          height="80"
          class="relative z-10 size-20 rounded-[30px] object-cover"
        />

          <span class="text-xl font-medium text-white">Easy level</span>
          <span class="text-base font-normal text-white/85">10 questions</span>
        </span>

      <a
        routerLink="/game"

          src="/assets/home/hard-quiz.png"
          alt=""
          width="80"
          height="80"
          class="relative z-10 size-20 rounded-[30px] object-cover"

          <span class="text-xl font-medium text-white">Hard level</span>
          <span class="text-base font-normal text-white/85">10 questions</span>
        </span>
      </a>

    <div class="mt-auto flex justify-center pt-12">
      <a
        routerLink="/game"
        class="flex h-20 w-[260px] items-center justify-center rounded-[55px] border border-solid border-[#2e9ce9]"
      >
        <span
          class="flex h-[60px] w-[240px] items-center justify-center rounded-[53px] bg-gradient-to-b from-[#2cb2ed] from-[15%] to-[#3550dc] text-2xl font-medium text-white shadow-[4px_4px_15px_rgba(255,255,255,0.25),-4px_-4px_15px_rgba(255,255,255,0.25)]"
