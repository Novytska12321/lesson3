<h2>Game</h2>

@if (question) {
    <article>
        <h3>{{ question.text }}</h3>
        <ul>
            @for (answer of question.answers; track answer.id) {
            <li>
                <label>
                    <input type="radio" name="answer" [value]="answer.id" />
                    {{ answer.text }}
                </label>
            </li>
            }
        </ul>
    </article>
} @else {
    loading...
}
